name: 抓取自建API盘口数据

on:
  schedule:
    - cron: '*/5 * * * *'  # 每5分钟跑一次
  workflow_dispatch:  # 可以手动触发

jobs:
  fetch-odds:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 运行抓取脚本
        run: node .github/scripts/fetch-self-api.js

      - name: 提交数据到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/self_api_odds.json
          git diff --staged --quiet || git commit -m "更新盘口数据 $(date '+%Y-%m-%d %H:%M')"
          git push
